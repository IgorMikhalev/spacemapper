# Builds the packages and tests them on several distributions.
#
# - On every push and pull request: build and test.
# - When a tag like v0.4.0 is pushed: also create a GitHub release with the
#   packages attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          rustup toolchain install stable --profile minimal
          python3 -m pip install --break-system-packages ziglang zstandard
          cargo install --locked cargo-zigbuild cargo-generate-rpm

      - name: Run tests
        run: cargo test --release --locked

      - name: Build packages
        run: bash packaging/build-packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:11
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: ubuntu:22.04
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: fedora:latest
            install: dnf install -y ./dist/*.rpm
          - image: opensuse/tumbleweed
            install: zypper --non-interactive install --allow-unsigned-rpm ./dist/*.rpm
          - image: archlinux:latest
            install: pacman -Syu --noconfirm && pacman -U --noconfirm ./dist/*.pkg.tar.zst
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Install package
        run: ${{ matrix.install }}
      - name: Check that it runs
        run: |
          spacemapper --version
          test -f /usr/share/applications/spacemapper.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/spacemapper.png

  release:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
