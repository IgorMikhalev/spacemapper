[package]
name = "spacemapper"
version = "0.6.0"
edition = "2024"
description = "Treemap disk usage viewer"
license = "GPL-3.0-or-later"
repository = "https://github.com/Martin-ii/spacemapper"
authors = ["Martin Fleisch"]
readme = "README.md"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui-phosphor = "0.11"
rayon = "1.12.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console","Win32_System_WindowsProgramming",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Used by `cargo generate-rpm` (see packaging/build-packages.sh)
[package.metadata.generate-rpm]
summary = "Treemap disk usage viewer"
release = "1"
assets = [
    { source = "target/x86_64-unknown-linux-gnu/release/spacemapper", dest = "/usr/bin/spacemapper", mode = "755" },
    { source = "packaging/spacemapper.desktop", dest = "/usr/share/applications/spacemapper.desktop", mode = "644" },
    { source = "assets/icon/spacemapper-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/spacemapper.png", mode = "644" },
    { source = "assets/icon/spacemapper-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/spacemapper.png", mode = "644" },
    { source = "assets/icon/spacemapper-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/spacemapper.png", mode = "644" },
    { source = "assets/icon/spacemapper-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/spacemapper.png", mode = "644" },
    { source = "assets/icon/spacemapper-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/spacemapper.png", mode = "644" },
    { source = "assets/icon/spacemapper-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/spacemapper.png", mode = "644" },
    { source = "packaging/io.github.martin_ii.spacemapper.metainfo.xml", dest = "/usr/share/metainfo/io.github.martin_ii.spacemapper.metainfo.xml", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/spacemapper/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/spacemapper/LICENSE", mode = "644", doc = true },
    { source = "assets/Inter-LICENSE.txt", dest = "/usr/share/licenses/spacemapper/Inter-LICENSE.txt", mode = "644", doc = true },
]
auto-req = "no"

[package.metadata.generate-rpm.requires]
"libGL.so.1()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"

[package.metadata.generate-rpm.recommends]
"libxkbcommon-x11" = "*"
"libXcursor" = "*"
"libXi" = "*"
xdg-utils = "*"
polkit = "*"
